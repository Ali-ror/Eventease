default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: eventease_development
<% if ENV["DATABASE_HOST"].present? %>
  host: <%= ENV["DATABASE_HOST"] %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
<% else %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
<% end %>

test:
  <<: *default
  database: eventease_test
<% if ENV["DATABASE_HOST"].present? %>
  host: <%= ENV["DATABASE_HOST"] %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
<% else %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
<% end %>

production:
  <<: *default
  database: eventease_production
  username: eventease
  password: <%= ENV["EVENTEASE_DATABASE_PASSWORD"] %>
